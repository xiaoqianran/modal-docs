# Fetch Modal docs from official llms.txt, machine-translate zh-CN cache,
# build dual-locale static site, deploy GitHub Pages.
# Daily schedule keeps the mirror fresh.

name: Fetch · Build · Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily 06:00 UTC ≈ 15:00 JST
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip re-fetch (build committed docs only)"
        type: boolean
        default: false
      skip_translate:
        description: "Skip zh-CN machine translation step"
        type: boolean
        default: false
      commit_docs:
        description: "Commit refreshed docs + zh cache back to main"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Avoid loop when bot commits refreshed docs
    if: ${{ github.event_name != 'push' || github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build deps
        run: npm install --no-save marked@15.0.0

      - name: Fetch Modal docs (llms.txt + pages)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_fetch != true }}
        env:
          FETCH_CONCURRENCY: "8"
          FETCH_TIMEOUT_MS: "30000"
        run: node scripts/fetch-docs.mjs

      - name: Translate docs to zh-CN (hash-cached)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_translate != true }}
        env:
          TRANSLATE_CONCURRENCY: "2"
          TRANSLATE_CHUNK: "1200"
        run: node scripts/translate-docs.mjs
        # gtx is best-effort; site still builds with EN fallback under /zh/ if this fails
        continue-on-error: true

      - name: Commit refreshed docs + zh cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commit_docs != false) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/llms.txt docs/llms-urls.txt docs/list.json docs/pages docs/zh || true
          if git diff --staged --quiet; then
            echo "No doc changes to commit"
          else
            git commit -m "chore: refresh Modal docs + zh-CN cache [skip ci]"
            git push origin HEAD:main
          fi


      - name: Body quality report
        env:
          QUALITY_PAGES: docs/pages,docs/zh/pages
          QUALITY_STRICT: "0"
        run: node scripts/quality-report.mjs

      - name: Build static site (EN + zh-CN)
        env:
          PAGES_BASE: /modal-docs
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
